<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f4ef">
  <title>REGIEPLANER</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h10M4 17.5h7"/><circle cx="18" cy="16.5" r="3.5"/><path d="m17 16.5 1 1 2-2"/></svg>
        </div>
        <div>
          <div class="brand-name">REGIEPLANER</div>
          <div class="brand-caption">Digitaler Ablaufplan für die Live-Regie</div>
        </div>
      </div>
      <div class="ad-timer" aria-label="Timer Werbung">
        <label class="ad-timer-label" for="ad-timer-duration">Timer Werbung</label>
        <input class="ad-timer-duration" id="ad-timer-duration" type="text" inputmode="numeric" maxlength="6" placeholder="MM:SS" autocomplete="off" aria-label="Dauer des Werbetimers in Minuten und Sekunden">
        <output class="ad-timer-display" id="ad-timer-display" role="timer" aria-label="Verbleibende Werbezeit" hidden>00:00</output>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy">
          <p class="eyebrow">Rundown</p>
          <input class="show-name" id="page-title" type="text" maxlength="50" placeholder="Name der Sendung" aria-label="Name der Sendung" autocomplete="off">
        </div>
        <div class="section-meta">
          <time class="system-clock" id="system-clock" aria-label="Aktuelle Systemzeit"></time>
          <span class="task-count" id="task-count">0 offen</span>
          <button class="mode-button" id="mode-button" type="button">Live-Modus starten</button>
        </div>
      </section>

      <div class="workspace">
        <section class="queue-section" aria-label="Ablauf">
          <div class="task-list" id="task-list" aria-live="polite"></div>

          <details class="history" id="history">
            <summary>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              <span id="history-label">Erledigte Aufgaben (0)</span>
            </summary>
            <div class="history-list" id="history-list"></div>
          </details>
        </section>

        <aside class="side-panel" aria-label="Aufgabe hinzufügen">
          <form class="add-form" id="add-form">
            <label class="form-label" for="task-input">Aufgabe ergänzen</label>
            <div class="input-wrap">
              <input class="task-input" id="task-input" name="task" type="text" maxlength="120" placeholder="z. B. Fragen aus dem Chat" autocomplete="off" required>
            </div>
            <button class="add-button" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span>Zur Liste hinzufügen</span>
            </button>
          </form>
          <div class="transfer-actions" aria-label="Aufgabenliste übertragen">
            <button class="transfer-button" id="export-button" type="button" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 15v5h14v-5"/></svg>
              <span>Liste exportieren</span>
            </button>
            <button class="transfer-button" id="import-button" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M5 14v6h14v-6"/></svg>
              <span>Liste importieren</span>
            </button>
          </div>
          <input id="import-file" type="file" accept=".json,application/json" hidden>
          <p class="transfer-status" id="transfer-status" role="status" aria-live="polite"></p>
          <p class="storage-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h12l2 2V20H5z"/><path d="M8 4.5v5h8v-5M8 20v-7h8v7"/></svg>
            Änderungen werden automatisch in diesem Browser gespeichert.
          </p>
        </aside>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
