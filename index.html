<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f4ef">
  <title>Regieplan · Livestream</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f4ef;
      --surface: #ffffff;
      --ink: #182321;
      --muted: #78817b;
      --line: #e2e6df;
      --green: #17694d;
      --green-dark: #104d39;
      --green-pale: #e7f1eb;
      --orange: #e46e45;
      --orange-pale: #fff0e8;
      --shadow: 0 16px 42px rgba(26, 49, 39, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d7ded6 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .shell {
      width: min(1056px, calc(100% - 48px));
      margin: 0 auto;
      padding: 30px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(24, 35, 33, 0.12);
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: var(--green);
    }

    .brand-mark svg { width: 21px; height: 21px; }
    .brand-name { font-size: 15px; font-weight: 750; letter-spacing: 0; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 11px; }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid #f1c9b8;
      border-radius: 999px;
      color: #a64b2c;
      background: #fff8f3;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 3px rgba(228, 110, 69, 0.13);
      animation: pulse 2s ease-out infinite;
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 0 6px rgba(228, 110, 69, 0); }
    }

    main { padding-top: 44px; }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
      animation: arrive 420ms ease-out both;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 5vw, 46px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 14px; }

    .progress {
      min-width: 144px;
      padding-bottom: 3px;
      text-align: right;
    }

    .progress-number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      line-height: 1;
    }

    .progress-label {
      margin-top: 7px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 304px;
      align-items: start;
      gap: 48px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 500;
    }

    .task-count {
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
    }

    .task-list { display: grid; gap: 10px; }

    .task-card {
      position: relative;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 78px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      animation: arrive 260ms ease-out both;
    }

    .task-card.current {
      min-height: 104px;
      border-color: var(--green);
      box-shadow: var(--shadow);
    }

    .task-card.current::before {
      position: absolute;
      top: 15px;
      bottom: 15px;
      left: -1px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--orange);
      content: "";
    }

    .task-index {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
    }

    .current .task-index {
      border-color: var(--green-pale);
      color: var(--green);
      background: var(--green-pale);
    }

    .task-copy { min-width: 0; }

    .task-status {
      margin-bottom: 5px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .current .task-status { color: var(--green); }

    .task-title {
      overflow-wrap: anywhere;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.35;
    }

    .current .task-title { font-size: 17px; }

    .task-actions { display: flex; align-items: center; gap: 5px; }

    .icon-button {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 5px;
      color: #8b938e;
      background: transparent;
      cursor: pointer;
    }

    .icon-button:hover { color: #a64b2c; background: var(--orange-pale); }
    .icon-button svg { width: 16px; height: 16px; }

    .empty-state {
      padding: 30px 24px;
      border: 1px dashed #cbd4cb;
      border-radius: 7px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .next-button {
      display: flex;
      width: 100%;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
      border: 0;
      border-radius: 5px;
      color: white;
      background: var(--green);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .next-button:not(:disabled):hover { background: var(--green-dark); transform: translateY(-1px); }
    .next-button:disabled { color: #8b938e; background: #e1e5e0; cursor: not-allowed; }
    .next-button svg { width: 17px; height: 17px; }

    .side-panel {
      padding-top: 2px;
      animation: arrive 500ms 80ms ease-out both;
    }

    .add-form {
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(26, 49, 39, 0.04);
    }

    .form-label {
      display: block;
      margin-bottom: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
    }

    .input-wrap { position: relative; }

    .task-input {
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      border: 1px solid #d9dfd8;
      border-radius: 4px;
      outline: none;
      color: var(--ink);
      background: #fcfdfa;
      font-size: 13px;
    }

    .task-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(23, 105, 77, 0.1); }
    .task-input::placeholder { color: #a0a8a1; }

    .add-button {
      display: flex;
      width: 100%;
      min-height: 43px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
    }

    .add-button:hover { border-color: var(--green); color: var(--green); background: #f6faf7; }
    .add-button svg { width: 15px; height: 15px; }

    .transfer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

    .transfer-button {
      display: flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: #59645d;
      background: #fbfcfa;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
      transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
    }

    .transfer-button:hover:not(:disabled) { border-color: var(--green); color: var(--green); background: #f6faf7; }
    .transfer-button:disabled { color: #9aa19c; cursor: not-allowed; }
    .transfer-button svg { width: 15px; height: 15px; flex: 0 0 auto; }

    .transfer-status:empty { display: none; }

    .transfer-status {
      margin: 10px 2px 0;
      color: var(--green);
      font-size: 11px;
      line-height: 1.45;
    }

    .transfer-status.error { color: #a64b2c; }

    .storage-note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 15px 2px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .storage-note svg { width: 14px; height: 14px; flex: 0 0 auto; margin-top: 1px; color: var(--green); }

    .history { margin-top: 35px; }

    .history summary {
      display: flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      list-style: none;
    }

    .history summary::-webkit-details-marker { display: none; }
    .history summary svg { width: 14px; height: 14px; transition: transform 150ms ease; }
    .history[open] summary svg { transform: rotate(90deg); }
    .history-list { display: grid; gap: 8px; margin-top: 13px; }
    .task-card.completed { min-height: 62px; opacity: 0.68; }
    .completed .task-title { color: #65706a; font-size: 13px; text-decoration: line-through; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 32px, 560px); padding-top: 18px; }
      main { padding-top: 34px; }
      .workspace { grid-template-columns: 1fr; gap: 32px; }
      .side-panel { grid-row: 1; }
      .intro { align-items: start; margin-bottom: 24px; }
      .progress { min-width: 78px; }
      .progress-number { font-size: 22px; }
      .progress-label { font-size: 9px; }
      .add-form { padding: 16px; }
      .form-label { margin-bottom: 10px; }
      .storage-note { display: none; }
      .task-card { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; padding: 14px 12px; }
      .task-card.current { min-height: 96px; }
      .task-index { width: 31px; height: 31px; }
      .icon-button { width: 30px; height: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h10M4 17.5h7"/><circle cx="18" cy="16.5" r="3.5"/><path d="m17 16.5 1 1 2-2"/></svg>
        </div>
        <div>
          <div class="brand-name">Regieplan</div>
          <div class="brand-caption">Livestream Ablauf</div>
        </div>
      </div>
      <div class="live-pill"><span class="live-dot" aria-hidden="true"></span>ON AIR</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Live-Regie / Ablauf</p>
          <h1 id="page-title">Was steht als Nächstes an?</h1>
          <p class="subtitle">Der aktuelle Programmpunkt steht immer ganz oben.</p>
        </div>
        <div class="progress" aria-live="polite">
          <div class="progress-number" id="progress-number">0 / 0</div>
          <div class="progress-label">Aufgaben erledigt</div>
        </div>
      </section>

      <div class="workspace">
        <section class="queue-section" aria-labelledby="queue-heading">
          <div class="section-heading">
            <h2 id="queue-heading">Programmliste</h2>
            <span class="task-count" id="task-count">0 offen</span>
          </div>
          <div class="task-list" id="task-list" aria-live="polite"></div>
          <button class="next-button" id="next-button" type="button">
            <span>Nächste Aufgabe</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>

          <details class="history" id="history">
            <summary>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              <span id="history-label">Erledigte Aufgaben (0)</span>
            </summary>
            <div class="history-list" id="history-list"></div>
          </details>
        </section>

        <aside class="side-panel" aria-label="Aufgabe hinzufügen">
          <form class="add-form" id="add-form">
            <label class="form-label" for="task-input">Aufgabe ergänzen</label>
            <div class="input-wrap">
              <input class="task-input" id="task-input" name="task" type="text" maxlength="120" placeholder="z. B. Fragen aus dem Chat" autocomplete="off" required>
            </div>
            <button class="add-button" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span>Zur Liste hinzufügen</span>
            </button>
          </form>
          <div class="transfer-actions" aria-label="Aufgabenliste übertragen">
            <button class="transfer-button" id="export-button" type="button" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 15v5h14v-5"/></svg>
              <span>Liste exportieren</span>
            </button>
            <button class="transfer-button" id="import-button" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M5 14v6h14v-6"/></svg>
              <span>Liste importieren</span>
            </button>
          </div>
          <input id="import-file" type="file" accept=".json,application/json" hidden>
          <p class="transfer-status" id="transfer-status" role="status" aria-live="polite"></p>
          <p class="storage-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h12l2 2V20H5z"/><path d="M8 4.5v5h8v-5M8 20v-7h8v7"/></svg>
            Änderungen werden automatisch in diesem Browser gespeichert.
          </p>
        </aside>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "regieplan-livestream-v1";
    const starterTasks = [
      { id: "welcome", title: "Begrüßung & Stream-Start" },
      { id: "intro", title: "Thema und Ablauf vorstellen" },
      { id: "main", title: "Hauptteil: erste Gesprächsrunde" },
      { id: "chat", title: "Fragen aus dem Chat beantworten" },
      { id: "outro", title: "Zusammenfassung & Verabschiedung" }
    ];

    const elements = {
      list: document.querySelector("#task-list"),
      historyList: document.querySelector("#history-list"),
      history: document.querySelector("#history"),
      historyLabel: document.querySelector("#history-label"),
      count: document.querySelector("#task-count"),
      progress: document.querySelector("#progress-number"),
      next: document.querySelector("#next-button"),
      form: document.querySelector("#add-form"),
      input: document.querySelector("#task-input"),
      exportButton: document.querySelector("#export-button"),
      importButton: document.querySelector("#import-button"),
      importFile: document.querySelector("#import-file"),
      transferStatus: document.querySelector("#transfer-status")
    };

    function loadState() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (stored && Array.isArray(stored.pending) && Array.isArray(stored.completed)) return stored;
      } catch (error) {
        console.warn("Der gespeicherte Regieplan konnte nicht geladen werden.", error);
      }
      return { pending: [...starterTasks], completed: [] };
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.warn("Der Regieplan konnte nicht gespeichert werden.", error);
      }
    }

    function makeTaskCard(task, index, completed = false) {
      const card = document.createElement("article");
      card.className = `task-card${index === 0 && !completed ? " current" : ""}${completed ? " completed" : ""}`;

      const number = document.createElement("div");
      number.className = "task-index";
      number.textContent = completed ? "✓" : String(index + 1).padStart(2, "0");
      number.setAttribute("aria-hidden", "true");

      const copy = document.createElement("div");
      copy.className = "task-copy";
      const status = document.createElement("div");
      status.className = "task-status";
      status.textContent = completed ? "Erledigt" : index === 0 ? "Jetzt dran" : "Als Nächstes";
      const title = document.createElement("div");
      title.className = "task-title";
      title.textContent = task.title;
      copy.append(status, title);

      const actions = document.createElement("div");
      actions.className = "task-actions";
      if (!completed) {
        const remove = document.createElement("button");
        remove.className = "icon-button";
        remove.type = "button";
        remove.setAttribute("aria-label", `Aufgabe „${task.title}“ entfernen`);
        remove.title = "Aufgabe entfernen";
        remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 13h11l1-13M9 7V4h6v3"/></svg>';
        remove.addEventListener("click", () => {
          state.pending = state.pending.filter((item) => item.id !== task.id);
          saveState();
          render();
        });
        actions.append(remove);
      }

      card.append(number, copy, actions);
      return card;
    }

    function render() {
      elements.list.replaceChildren();
      if (state.pending.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = state.completed.length
          ? "Der Ablauf ist geschafft. Füge eine neue Aufgabe hinzu, um weiterzumachen."
          : "Noch keine Aufgaben im Ablauf. Füge rechts den ersten Programmpunkt hinzu.";
        elements.list.append(empty);
      } else {
        state.pending.forEach((task, index) => elements.list.append(makeTaskCard(task, index)));
      }

      elements.historyList.replaceChildren();
      state.completed.forEach((task, index) => elements.historyList.append(makeTaskCard(task, index, true)));
      elements.history.hidden = state.completed.length === 0;
      elements.historyLabel.textContent = `Erledigte Aufgaben (${state.completed.length})`;
      elements.count.textContent = `${state.pending.length} offen`;
      elements.progress.textContent = `${state.completed.length} / ${state.completed.length + state.pending.length}`;
      elements.next.disabled = state.pending.length === 0;
      elements.exportButton.disabled = state.pending.length + state.completed.length === 0;
    }

    function exportTasks() {
      const tasks = [...state.completed].reverse().concat(state.pending).map((task) => task.title);
      const payload = {
        format: "regieplan-tasks",
        version: 1,
        exportedAt: new Date().toISOString(),
        tasks
      };
      const file = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = url;
      link.download = `regieplan-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      elements.transferStatus.classList.remove("error");
      elements.transferStatus.textContent = `${tasks.length} Aufgaben exportiert.`;
    }

    async function importTasks(file) {
      if (!file) return;
      elements.importFile.value = "";
      try {
        const payload = JSON.parse(await file.text());
        if (payload?.format !== "regieplan-tasks" || payload.version !== 1 || !Array.isArray(payload.tasks)) {
          throw new Error("Die Datei hat kein unterstütztes Regieplan-Format.");
        }
        if (payload.tasks.length > 500 || payload.tasks.some((title) => typeof title !== "string" || !title.trim() || title.trim().length > 120)) {
          throw new Error("Die Datei enthält ungültige Aufgaben.");
        }
        if (!window.confirm("Der Import ersetzt die aktuelle Aufgabenliste und deren Erledigt-Historie. Fortfahren?")) return;

        state = {
          pending: payload.tasks.map((title) => ({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            title: title.trim()
          })),
          completed: []
        };
        saveState();
        render();
        elements.transferStatus.classList.remove("error");
        elements.transferStatus.textContent = `${state.pending.length} Aufgaben importiert.`;
      } catch (error) {
        elements.transferStatus.classList.add("error");
        elements.transferStatus.textContent = error instanceof SyntaxError
          ? "Die Datei ist kein gültiges JSON."
          : error.message || "Die Aufgabenliste konnte nicht importiert werden.";
      }
    }

    elements.form.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = elements.input.value.trim();
      if (!title) return;
      state.pending.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, title });
      elements.input.value = "";
      saveState();
      render();
      elements.input.focus();
    });

    elements.next.addEventListener("click", () => {
      if (state.pending.length === 0) return;
      state.completed.unshift(state.pending.shift());
      saveState();
      render();
    });

    elements.exportButton.addEventListener("click", exportTasks);
    elements.importButton.addEventListener("click", () => elements.importFile.click());
    elements.importFile.addEventListener("change", () => importTasks(elements.importFile.files[0]));

    render();
  </script>
</body>
</html>
